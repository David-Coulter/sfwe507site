{% extends 'base.html' %}

{% block title %}Reset Password - PDMS{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header">
            Reset Password
        </div>
        <div class="card-body">
            <p class="text-muted">
                Enter your email address and we will display a reset message for this project demo.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.email.label_tag }}
                {{ form.email }}

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Send Reset Email
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
